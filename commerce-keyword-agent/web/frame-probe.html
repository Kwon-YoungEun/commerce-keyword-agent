<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>NPS 프레임 확인</title>
<style>
  body { font-family: Pretendard, "Malgun Gothic", sans-serif; margin: 20px;
         background: #F7F8FA; color: #202124; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .ask { font-size: 13px; color: #5F6368; margin: 0 0 18px; }
  .case { margin-bottom: 22px; }
  .case h2 { font-size: 13px; margin: 0 0 6px; }
  .case h2 b { color: #EA002C; }
  .case code { font-size: 11.5px; color: #5F6368; }
  iframe { width: 100%; height: 480px; border: 2px solid #E5E7EB;
           border-radius: 8px; background: #fff; }
</style>
</head>
<body>

<h1>어느 쪽에 상품 목록이 보이나요?</h1>
<p class="ask">두 칸 중 <b>상품 사진과 가격이 줄줄이 나오는 칸</b>의 번호를 알려주세요. 둘 다 안 나오면 "둘 다"라고 알려주시면 됩니다.</p>

<div class="case">
  <h2><b>1번</b> — search.shopping.naver.com
    <code>/ns/search?query=재첩</code></h2>
  <iframe src="https://search.shopping.naver.com/ns/search?query=%EC%9E%AC%EC%B2%A9"></iframe>
</div>

<div class="case">
  <h2><b>2번</b> — shopping.naver.com
    <code>/ns/search?query=재첩</code> (지금 적용된 것 — 검색창만 나옴)</h2>
  <iframe src="https://shopping.naver.com/ns/search?query=%EC%9E%AC%EC%B2%A9"></iframe>
</div>

</body>
</html>
